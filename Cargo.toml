[package]
name = "adr"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "adr"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting"] }
serde_json = "1"
tiny_http = "0.12"

[features]
owner-bypass = []
