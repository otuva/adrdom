[package]
name = "adr"
# Placeholder: the tool's version lives in the repo-root VERSION file
# (see src/version.rs and "Does every ledger row carry the tool version?"),
# not here.
version = "0.0.0"
edition = "2021"

[lib]
name = "adr"
path = "src/lib.rs"

[[bin]]
name = "adr"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting"] }
serde_json = "1"
tiny_http = "0.12"

[features]
owner-bypass = []
