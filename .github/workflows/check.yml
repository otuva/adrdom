name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # `adr check` reads the current commit's tree (`git show HEAD:...`)
      # and the working tree/index, plus, at a merge commit, both of
      # HEAD's parents (per "Does check at a merge look for the ledger
      # rows of both branches?") -- depth 2 is enough for `HEAD^1`/`HEAD^2`
      # to resolve there.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo test --all-features
        run: cargo test --all-features

      - name: cargo build --release
        run: cargo build --release

      - name: adr check
        run: ./target/release/adr check
