name: release

# A push to main that changes VERSION builds and publishes a release.
on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

# One release run at a time, so two runs never race to create one tag.
concurrency:
  group: release
  cancel-in-progress: false

env:
  DIST_VERSION: 0.32.0

jobs:
  prepare:
    # A manual run may be started on any branch; only main releases.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Read version and look for the release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$version exists already; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-apple-darwin
            os: macos-14
          # Built on the Apple silicon runner: the Intel macOS runners are retired.
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install the Rust target
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - name: Install dist
        shell: bash
        run: |
          base="https://github.com/axodotdev/cargo-dist/releases/download/v$DIST_VERSION"
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -ExecutionPolicy Bypass -c "irm $base/cargo-dist-installer.ps1 | iex"
          else
            curl --proto '=https' --tlsv1.2 -LsSf "$base/cargo-dist-installer.sh" | sh
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Write the version into Cargo.toml
        shell: bash
        run: |
          sed -i.bak 's/^version = "0.0.0"$/version = "${{ needs.prepare.outputs.version }}"/' Cargo.toml
          rm Cargo.toml.bak
          grep -q '^version = "${{ needs.prepare.outputs.version }}"$' Cargo.toml
          cargo metadata --format-version 1 > /dev/null

      - name: Build
        shell: bash
        run: |
          dist build --artifacts=local --target ${{ matrix.target }} --tag v${{ needs.prepare.outputs.version }} --output-format=json > dist-manifest.json
          # The global build reads the local artifacts' manifests from target/distrib.
          cp dist-manifest.json target/distrib/${{ matrix.target }}-dist-manifest.json

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: local-${{ matrix.target }}
          path: |
            target/distrib/adrdom-*.tar.xz
            target/distrib/adrdom-*.zip
            target/distrib/*.sha256
            target/distrib/*-dist-manifest.json
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install dist
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v$DIST_VERSION/cargo-dist-installer.sh" | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Write the version into Cargo.toml
        run: |
          sed -i 's/^version = "0.0.0"$/version = "${{ needs.prepare.outputs.version }}"/' Cargo.toml
          grep -q '^version = "${{ needs.prepare.outputs.version }}"$' Cargo.toml
          cargo metadata --format-version 1 > /dev/null

      # The global build reads the local artifacts from target/distrib, so the
      # installers and sha256.sum cover the archives.
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: local-*
          path: target/distrib
          merge-multiple: true

      - name: Build the installers and checksums
        run: |
          dist build --artifacts=global --tag v${{ needs.prepare.outputs.version }}
          rm -f target/distrib/*-dist-manifest.json

      # dist cannot make GitHub's generated release notes, so gh makes the release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.prepare.outputs.version }}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$tag" --generate-notes \
            target/distrib/adrdom-*.tar.xz \
            target/distrib/adrdom-*.zip \
            target/distrib/adrdom-*.sha256 \
            target/distrib/adrdom-installer.sh \
            target/distrib/adrdom-installer.ps1 \
            target/distrib/sha256.sum \
            target/distrib/source.tar.gz \
            target/distrib/source.tar.gz.sha256
